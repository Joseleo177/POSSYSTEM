<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo oficial (la N de NXUS). El SVG va primero para los navegadores que lo usan —se ve
         nítido en cualquier tamaño—; el PNG queda de respaldo y el de 180 es el ícono de iPhone y
         iPad al "Agregar a inicio". El ?v= obliga a soltar de la caché el ícono de Nexus. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <!-- Permite instalar la app ("Instalar" en Chrome/Edge, "Añadir a inicio" en el iPad) para
         abrirla sin internet. Ver pwa/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <title>NXUS ERP</title>
    <!-- En la vitrina (/catalogo/...) la función api/vitrina.js reemplaza título y descripción
         por los de la tienda o el producto. -->
    <meta name="description" content="NXUS ERP: ventas, inventario por sucursal y cobros en bolívares y dólares, desde un solo lugar." />
    <!-- Previene flash al cargar: aplica dark class antes de que React monte -->
    <script>
      (function () {
        const saved = localStorage.getItem("pos-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!-- Esta página puede venir de una caché con los nombres de JS y CSS de un despliegue
         anterior, que ya no existen (la vitrina pasa por la CDN de Vercel): la pantalla queda en
         blanco. Si falla uno de esos archivos se recarga UNA vez con ?_v=, que no está en
         ninguna caché. La marca la quita main.jsx cuando la app arranca. -->
    <script>
      (function () {
        var MARCA = "nxus_recarga_html";
        try {
          var u = new URL(location.href);
          if (u.searchParams.has("_v")) { u.searchParams.delete("_v"); history.replaceState(history.state, "", u.toString()); }
        } catch (_) { /* navegador viejo */ }
        window.addEventListener("error", function (e) {
          var t = e.target;
          // Ya arrancada, lo que falle es de una pantalla perezosa: eso lo resuelve App.jsx.
          if (window.__nxusArranco) return;
          if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          if (String(t.src || t.href || "").indexOf("/assets/") === -1) return;
          try {
            if (sessionStorage.getItem(MARCA)) return;
            sessionStorage.setItem(MARCA, "1");
            var u = new URL(location.href);
            u.searchParams.set("_v", Date.now());
            location.replace(u.toString());
          } catch (_) { /* modo privado: sin recarga automática */ }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
